apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      containers:
        - name: chart-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.existingSecret | default (printf "%s-discord" .Release.Name) }}
                  key: DISCORD_TOKEN
            {{- if .Values.proxyServer }}
            - name: PROXY_SERVER
              value: {{ .Values.proxyServer | quote }}
            {{- end }}
            {{- if .Values.guildID }}
            - name: GUILD_ID
              value: {{ .Values.guildID | quote }}
            {{- end }}
            {{- if .Values.maxConcurrent }}
            - name: MAX_CONCURRENT
              value: {{ .Values.maxConcurrent | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
